<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kontakt — das Kulturfestival 2026</title>
    <meta
      name="description"
      content="Programm & Spielplan für kontakt — das Kulturfestival 2026. 21.–24. Mai, Metalluk-Gelände Bamberg."
    >
    <meta property="og:title" content="kontakt — das Kulturfestival 2026">
    <meta
      property="og:description"
      content="Programm & Spielplan. 21.–24. Mai, Metalluk-Gelände Bamberg."
    >
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#3d1a2e">
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <div id="galaxy"></div>
    <canvas id="stars"></canvas>

    <div class="frame">
      <header>
        <!-- Poster-style star accents -->
        <span class="hstar hstar-1">✦</span>
        <span class="hstar hstar-2">✦</span>
        <span class="hstar hstar-3">✧</span>
        <span class="hstar hstar-4">✦</span>
        <span class="hstar hstar-5">✧</span>
        <span class="hstar hstar-6">✦</span>
        <span class="hstar hstar-7">✦</span>
        <span class="hstar hstar-8">✧</span>
        <span class="hstar hstar-9">✦</span>
        <span class="hstar hstar-10">✦</span>

        <div class="hi">
          <!-- Left: title + subtitle -->
          <div class="hi-side hi-side-left">
            <div class="wm">KONTAKT</div>
            <div class="sl">DURCH RAUM UND ZEIT</div>
          </div>

          <!-- Center: starburst badge -->
          <div class="hbadge-wrap">
            <div class="hbadge">
              <img src="badge.png" alt="kontakt — Das Kulturfestival · 20 Jahre">
            </div>
          </div>

          <!-- Right: date + location -->
          <div class="hi-side hi-side-right">
            <div class="hd">21.–24.05.2026</div>
            <div class="hl">Metalluk-Gelände</div>
            <div class="hl">Ohmstraße 8 · Bamberg</div>
          </div>
        </div>
      </header>

      <div class="sb">
        <div class="dt" id="dayTabs" role="tablist" aria-label="Festivaltage"></div>

        <div class="srow">
          <input
            class="si"
            id="search"
            type="search"
            placeholder="Suche nach Act, Workshop, Ort …"
            autocomplete="off"
          >
        </div>

        <div class="fi" id="trackFilters">
          <span class="fil">Format:</span>
        </div>

        <div class="fi" id="roomFilters">
          <span class="fil">Raum:</span>
        </div>
      </div>

      <main id="mainContent"></main>
    </div>

    <!-- Dev time panel (only shown with ?dev in URL) -->
    <div class="dev-panel" id="devPanel">
      <div class="dev-panel-title">⚙ DEV · Zeitsteuerung</div>

      <div class="dev-panel-body">
        <div class="dev-panel-row">
          <span>Datum</span>
          <input class="dev-panel-date" id="devDate" type="date" value="2026-05-21">
        </div>

        <div class="dev-panel-row">
          <span>Zeit</span>
          <input class="dev-panel-range" id="devTime" type="range" min="0" max="1439" value="780">
          <span class="dev-panel-label" id="devTimeLabel">13:00</span>
        </div>

        <button class="dev-panel-apply" id="devApplyBtn">Anwenden → Live testen</button>
        <div class="dev-panel-debug" id="devDebug"></div>
      </div>
    </div>

    <button class="fav-btn" id="favBtn" title="Mein Plan" aria-label="Mein Plan">
      ★<span class="fbadge" id="favBadge">0</span>
    </button>

    <div class="fav-panel" id="favPanel">
      <div class="fav-panel-h">
        <span>★ Mein Plan</span>
        <button
          class="fav-export-btn"
          id="icalExportBtn"
          title="Als Kalender exportieren (.ics)"
          aria-label="Als iCal exportieren"
        >
          ↓ .ics
        </button>
        <button aria-label="Schließen">✕</button>
      </div>

      <div id="favList"></div>
    </div>

    <!-- Modal -->
    <div class="mo" id="mo">
      <div class="md">
        <button class="mcl" id="mcl" aria-label="Schließen">✕</button>

        <div class="mhero-wrap" id="mheroWrap">
          <div class="mhero-bg" id="mheroBg"></div>
          <img class="mhero" id="mhero" src="" alt="">
        </div>

        <div class="mb">
          <div class="mlive" id="mlive">
            <span class="mlive-dot">●</span> LÄUFT GERADE
          </div>

          <div class="mtb" id="mtb"></div>
          <div class="mn" id="mn"></div>
          <div class="minf" id="minf"></div>
          <div class="mdv"></div>
          <div class="mde" id="mde"></div>

          <div class="mbtns">
            <a class="mlink" id="mlink" href="#" target="_blank">↗ Mehr auf cfp.kntkt.de</a>
            <button class="mfav" id="mfavBtn">☆ Merken</button>
          </div>
        </div>
      </div>
    </div>

    <script src="scripts/app.js"></script>

    <noscript>
      <div class="noscript-panel">
        <h1 class="noscript-title">kontakt 2026</h1>
        <p>Bitte JavaScript aktivieren, um das Programm zu sehen.</p>
        <p class="noscript-copy">
          Das Programm ist auch
          <a class="noscript-link" href="https://cfp.kntkt.de/kontakt-2026/schedule/nojs">ohne JavaScript verfügbar</a>.
        </p>
      </div>
    </noscript>
  </body>
</html>
