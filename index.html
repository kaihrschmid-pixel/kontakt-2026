    <script src="scripts/app.js?v=20260517b"></script>
    <script>
      (function () {
        const STORAGE_KEY = 'prog-collapsed';
        const btn = document.getElementById('progToggleBtn');
        const icon = document.getElementById('progToggleIcon');
        const wrap = document.getElementById('progCollapseWrap');
        const main = document.getElementById('mainContent');

        function setCollapsed(on, animate) {
          if (!animate) {
            wrap.style.transition = 'none';
            main.style.transition = 'none';
          }
          wrap.classList.toggle('collapsed', on);
          main.classList.toggle('collapsed', on);
          if (on) {
            main.style.maxHeight = '0';
            main.style.overflow = 'hidden';
            main.style.opacity = '0';
          } else {
            main.style.maxHeight = '';
            main.style.overflow = '';
            main.style.opacity = '';
          }
          icon.textContent = on ? '▼' : '▲';
          btn.title = on ? 'Programm einblenden' : 'Programm ausblenden';
          if (!animate) {
            requestAnimationFrame(() => {
              wrap.style.transition = '';
              main.style.transition = '';
            });
          }
          try { localStorage.setItem(STORAGE_KEY, on ? '1' : '0'); } catch(e) {}
        }

        // restore persisted state without animation
        const stored = (() => { try { return localStorage.getItem(STORAGE_KEY); } catch(e) { return null; } })();
        if (stored === '1') setCollapsed(true, false);

        btn.addEventListener('click', function () {
          const nowCollapsed = wrap.classList.contains('collapsed');
          setCollapsed(!nowCollapsed, true);
          if (!nowCollapsed) {
            // scroll to footer so the eval links are visible
            document.querySelector('.eval-footer')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      })();
    </script>
